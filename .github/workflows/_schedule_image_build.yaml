name: Image_oncall
on:
  workflow_call:
    inputs:
      suffix:
        description: 'The tag subfix to use'
        required: true
        type: string
      should_push:
        description: 'Whether to push the image'
        required: false
        type: boolean
        default: False
      dockerfile:
        description: 'The Dockerfile to use'
        required: false
        type: string
      image:
        description: 'Container image to run the job in (from Dockerfile FROM)'
        required: true
        type: string
      quay_username:
        description: 'Quay username for pushing images'
        required: false
        type: string
      workflow_dispatch_tag:
        description: 'The tag to use for workflow dispatch'
        required: false
        type: string
      branch_ref:
        description: 'Branch/ref to check out for non-workflow_dispatch events'
        required: false
        type: string
        default: 'main'
      schedule_tag_pattern:
        description: 'Pattern used for the schedule Docker tag'
        required: false
        type: string
        default: 'main'
      artifact_prefix:
        description: 'Prefix for digest artifact names'
        required: false
        type: string
        default: 'digests'
      vllm_commit:
        description: 'vLLM commit hash to checkout (used when set; mutually exclusive with tag/branch).'
        required: false
        type: string
        default: ''
      vllm_ascend_commit:
        description: 'vllm-ascend commit hash to checkout (used when set; mutually exclusive with tag/branch).'
        required: false
        type: string
        default: ''
      temp_only:
        description: 'If true, push only to QUAY_TEMP_REPO and skip the merge-image job (no push to QUAY_REPO).'
        required: false
        type: boolean
        default: false
    secrets:
        QUAY_TOKEN:
            description: 'Quay token for pushing images'
            required: false

env:
  QUAY_REPO: quay.io/atlas-ci/vllm-atlas-day0
  QUAY_TEMP_REPO: quay.io/atlas-ci/vllm-atlas-day0
  CACHE_REPO: quay.io/atlas-ci/vllm-atlas-day0

jobs:
  build-push-digest:
    name: build
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ inputs.image }}
    permissions:
      packages: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux/amd64
            runner: linux-amd64-cpu-4-buildkit
            tag: amd64

          - arch: linux/arm64
            runner: linux-aarch64-cpu-4-buildkit
            tag: arm64

    steps:

    - name: Validate inputs (workflow_dispatch only)
      if: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        tag="${{ inputs.workflow_dispatch_tag }}"
        branch="${{ inputs.branch_ref }}"
        vllm_commit="${{ inputs.vllm_commit }}"
        vllm_ascend_commit="${{ inputs.vllm_ascend_commit }}"

        commit_mode="false"
        if [[ -n "$vllm_commit" || -n "$vllm_ascend_commit" ]]; then
          if [[ -z "$vllm_commit" || -z "$vllm_ascend_commit" ]]; then
            echo "Error: 'vllm_commit' and 'vllm_ascend_commit' must be specified together."
            exit 1
          fi
          for c in "$vllm_commit" "$vllm_ascend_commit"; do
            if ! echo "$c" | grep -Eq '^[0-9a-f]{7,40}$'; then
              echo "Error: invalid commit format: $c (expected 7-40 hex chars)."
              exit 1
            fi
          done
          commit_mode="true"
        fi

        if [[ "$commit_mode" == "true" ]]; then
          if [[ -n "$tag" || -n "$branch" ]]; then
            echo "Error: commit mode is mutually exclusive with 'tag'/'branch'."
            exit 1
          fi
        else
          if [[ -n "$tag" && -n "$branch" ]]; then
            echo "Error: 'tag' and 'branch' are mutually exclusive. Please specify only one."
            exit 1
          fi
          if [[ -z "$tag" && -z "$branch" ]]; then
            echo "Error: Either 'tag', 'branch', or (vllm_commit + vllm_ascend_commit) must be specified."
            exit 1
          fi
        fi

    - uses: actions/checkout@v7
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.vllm_ascend_commit != '' }}
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.vllm_ascend_commit }}

    - uses: actions/checkout@v7
      if: ${{ github.event_name != 'workflow_dispatch' }}
      with:
        submodules: recursive
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.branch_ref }}

    - uses: actions/checkout@v7
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.workflow_dispatch_tag != '' }}
      with:
        submodules: recursive
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.workflow_dispatch_tag }}

    - uses: actions/checkout@v7
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.workflow_dispatch_tag == '' && inputs.vllm_ascend_commit == '' }}
      with:
        submodules: recursive
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.branch_ref }}

    - name: Free up disk space
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      with:
        tool-cache: true
        docker-images: false

    - name: Configure registry credentials
      if: ${{ inputs.should_push }}
      env:
        QUAY_USER: ${{ inputs.quay_username }}
        QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
      run: |
        mkdir -p ~/.docker
        QUAY_AUTH=$(printf "%s:%s" "$QUAY_USER" "$QUAY_TOKEN" | base64 -w0)
        cat > ~/.docker/config.json << EOF
        {"auths":{"quay.io":{"auth":"${QUAY_AUTH}"}}}
        EOF

    - name: Compute cache tag
      id: cache-tag
      run: |
        if [ -n "${{ inputs.suffix }}" ]; then
          echo "value=buildcache-${{ inputs.suffix }}-${{ matrix.tag }}" >> $GITHUB_OUTPUT
        else
          echo "value=buildcache-${{ matrix.tag }}" >> $GITHUB_OUTPUT
        fi

    - name: Get csrc hash
      id: get_csrc_hash
      run: |
        CSRC_HASH=$(find ./csrc ./setup.py ./CMakeLists.txt ./cmake \
        -type f -not -path '*/.*' | sort | xargs sha256sum | sha256sum | awk '{print $1}')
        echo "CSRC_HASH=$CSRC_HASH" >> $GITHUB_OUTPUT

    - name: Get Dockerfile base image tag
      id: get_base_image_tag
      run: |
        DOCKERFILE="${{ inputs.dockerfile || 'Dockerfile' }}"
        BASE_IMAGE_TAG=$(grep -m1 '^FROM' "$DOCKERFILE" | awk -F: '{print $NF}')
        echo "BASE_IMAGE_TAG=$BASE_IMAGE_TAG" >> $GITHUB_OUTPUT
        
    - name: Get architecture
      id: get_arch
      run: |
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) echo "arch=X64" >> $GITHUB_OUTPUT ;;
          aarch64) echo "arch=ARM64" >> $GITHUB_OUTPUT ;;
          *) echo "arch=$ARCH" >> $GITHUB_OUTPUT ;;
        esac

    - name: Cache vllm-ascend csrc
      id: cache-csrc
      uses: runs-on/cache/restore@v5
      with:
        path: |
            vllm_ascend/_cann_ops_custom
            vllm_ascend/*.so
            vllm_ascend/lib
            vllm_ascend/include
        key: vllm-ascend-build-v1-${{ steps.get_arch.outputs.arch }}-${{ steps.get_base_image_tag.outputs.BASE_IMAGE_TAG }}-${{ steps.get_csrc_hash.outputs.CSRC_HASH }}


    - name: Build and push
      id: build
      env:
        BUILDKITD_ADDR: ${{ vars.BUILDKITD_ADDR }}
        DOCKERFILE: ${{ inputs.dockerfile || 'Dockerfile' }}
        ARCH: ${{ matrix.arch }}
        MATRIX_TAG: ${{ matrix.tag }}
        SUFFIX_INPUT: ${{ inputs.suffix }}
        SCHEDULE_TAG_PATTERN: ${{ inputs.schedule_tag_pattern }}
        TEMP_ONLY: ${{ inputs.temp_only }}
        VLLM_COMMIT_INPUT: ${{ inputs.vllm_commit }}
        VLLM_ASCEND_COMMIT_INPUT: ${{ inputs.vllm_ascend_commit }}
        COMPILE_CUSTOM_KERNELS: ${{ steps.cache-csrc.outputs.cache-hit == 'true' && '0' || '1' }}
        VLLM_COMMIT: ${{ inputs.vllm_commit }}
        SHOULD_PUSH: ${{ inputs.should_push }}
        QUAY_TEMP_REPO: ${{ env.QUAY_TEMP_REPO }}
        CACHE_REPO: ${{ env.CACHE_REPO }}
        CACHE_TAG: ${{ steps.cache-tag.outputs.value }}
      run: |
        : "${BUILDKITD_ADDR:?BUILDKITD_ADDR is not set on the runner}"

        BUILD_ARGS=(
          --frontend dockerfile.v0
          --local context=.
          --local dockerfile=.
          --opt "filename=${DOCKERFILE}"
          --opt "platform=${ARCH}"
          --opt "build-arg:PIP_INDEX_URL=https://pypi.org/simple"
          --opt "build-arg:COMPILE_CUSTOM_KERNELS=${COMPILE_CUSTOM_KERNELS}"
          --opt "build-arg:VLLM_COMMIT=${VLLM_COMMIT}"
          --import-cache "type=registry,ref=${CACHE_REPO}:${CACHE_TAG}"
          --metadata-file /tmp/metadata.json
          --progress=plain
        )

        if [ -f "${HOME}/.docker/config.json" ]; then
          BUILD_ARGS+=(--secret "id=dockerconfig,src=${HOME}/.docker/config.json")
        fi

        if [ "${SHOULD_PUSH}" = "true" ]; then
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          SUFFIX=""
          if [ -n "${SUFFIX_INPUT}" ]; then
            SUFFIX="-${SUFFIX_INPUT}-${TIMESTAMP}"
          else
            SUFFIX="-${TIMESTAMP}"
          fi
          if [ "${TEMP_ONLY}" = "true" ]; then
            VLLM_SHORT=$(echo "${VLLM_COMMIT_INPUT}" | cut -c1-7)
            ASCEND_SHORT=$(echo "${VLLM_ASCEND_COMMIT_INPUT}" | cut -c1-7)
            TEMP_TAG="vllm-ascend-${VLLM_SHORT}-${ASCEND_SHORT}${SUFFIX}-${MATRIX_TAG}-temp"
          else
            TEMP_TAG="nightly-${SCHEDULE_TAG_PATTERN}${SUFFIX}-${MATRIX_TAG}-temp"
          fi
          echo "Building and pushing with temp tag: ${QUAY_TEMP_REPO}:${TEMP_TAG}"
          BUILD_ARGS+=(
            --output "type=image,name=${QUAY_TEMP_REPO}:${TEMP_TAG},push=true"
            --export-cache "type=registry,ref=${CACHE_REPO}:${CACHE_TAG},mode=max"
          )
        else
          BUILD_ARGS+=(--output "type=cacheonly")
        fi

        buildctl \
          --addr="$BUILDKITD_ADDR" \
          --tlscacert="${HOME}/.docker/ca.pem" \
          --tlscert="${HOME}/.docker/cert.pem" \
          --tlskey="${HOME}/.docker/key.pem" \
          build \
          "${BUILD_ARGS[@]}"

        if [ -f /tmp/metadata.json ]; then
          DIGEST=$(python3 -c "import json; print(json.load(open('/tmp/metadata.json'))['containerimage.digest'])")
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Image pushed: ${QUAY_TEMP_REPO}:${TEMP_TAG} (${DIGEST})"
        fi
