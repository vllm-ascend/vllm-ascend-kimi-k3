# This is a docker build check and publish job:
# 1. PR Triggered docker image build check
#   - 'image-build' label should be added
#   - is for image build check
#   - Enable on main/releases branch
#   - push: ${{ github.event_name != 'pull_request' }} ==> false
# 2. branches push trigger image publish
#   - is for branch/dev/nightly image
#   - commits are merge into main/*-dev  ==> vllm-ascend:main / vllm-ascend:*-dev
# 3. tags push trigger image publish
#   - is for final release image
#   - Publish when tag with v* (pep440 version)  ===>  vllm-ascend:v1.2.3 / vllm-ascend:v1.2.3rc1
name: Image Build and Push
on:
  push:
    tags:
      - 'v*'
  pull_request: 
    branches:
      - 'main'
      - 'releases/*'
    types: [ labeled ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag for build results (mutually exclusive with branch)'
        default: "none"
        required: false
        type: choice
        options:
          - main
          - v0.23.0rc1
          - v0.22.1rc1
          - v0.21.0rc1
          - v0.20.2rc1
          - none
      branch:
        description: 'Docker branch for build results (mutually exclusive with tag)'
        default: "releases/v0.23.0_ci_new"
        required: false
        type: choice
        options:
          - main
          - releases/v0.23.0_ci_new
          - releases/v0.23.0
          - none
      build_a2:
        description: 'Build A2 images'
        required: false
        type: boolean
        default: true
      build_a3:
        description: 'Build A3 images'
        required: false
        type: boolean
        default: true
      build_310p:
        description: 'Build 310P images'
        required: false
        type: boolean
        default: true
      build_ubuntu:
        description: 'Build Ubuntu-based images'
        required: false
        type: boolean
        default: true
      build_openeuler:
        description: 'Build openEuler-based images'
        required: false
        type: boolean
        default: true
      vllm_commit:
        description: 'vLLM commit hash (must be paired with vllm_ascend_commit; mutually exclusive with tag/branch). Image will be pushed only to QUAY_TOKEN.'
        required: false
        default: ''
        type: string
      vllm_ascend_commit:
        description: 'vllm-ascend commit hash (must be paired with vllm_commit; mutually exclusive with tag/branch). Image will be pushed only to QUAY_TOKEN.'
        required: false
        default: ''
        type: string

permissions:
  packages: write
  contents: read

jobs:
  generate-matrix:
    name: Generate Build Matrix
    runs-on: linux-amd64-cpu-2-hk
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_A2: ${{ inputs.build_a2 }}
          BUILD_A3: ${{ inputs.build_a3 }}
          BUILD_310P: ${{ inputs.build_310p }}
          BUILD_UBUNTU: ${{ inputs.build_ubuntu }}
          BUILD_OPENEULER: ${{ inputs.build_openeuler }}
        run: |
          python3 - << 'PYEOF' >> "$GITHUB_OUTPUT"
          import json, os
          all_entries = [
              {"name": "A2 Ubuntu", "dockerfile": "Dockerfile", "suffix": "", "image": "swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.1-910b-ubuntu22.04-py3.12"},
              {"name": "A2 openeuler", "dockerfile": "Dockerfile.openEuler", "suffix": "openeuler", "image": "swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.1-910b-openeuler24.03-py3.12"},
              {"name": "A3 Ubuntu", "dockerfile": "Dockerfile.a3", "suffix": "a3", "image": "swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.1-a3-ubuntu22.04-py3.12"},
              {"name": "A3 openEuler", "dockerfile": "Dockerfile.a3.openEuler", "suffix": "a3-openeuler", "image": "swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.1-a3-openeuler24.03-py3.12"},
              {"name": "310P Ubuntu", "dockerfile": "Dockerfile.310p", "suffix": "310p", "image": "swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-beta.1-310p-ubuntu22.04-py3.12"},
              {"name": "310P openEuler", "dockerfile": "Dockerfile.310p.openEuler", "suffix": "310p-openeuler", "image": "swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-beta.1-310p-openeuler24.03-py3.12"},
          ]
          event = os.environ.get("EVENT_NAME", "")
          if event != "workflow_dispatch":
              entries = all_entries
          else:
              ba2 = os.environ.get("BUILD_A2") == "true"
              ba3 = os.environ.get("BUILD_A3") == "true"
              b310p = os.environ.get("BUILD_310P") == "true"
              build_ubuntu = os.environ.get("BUILD_UBUNTU") == "true"
              bo = os.environ.get("BUILD_OPENEULER") == "true"
              entries = []
              if ba2 and build_ubuntu: entries.append(all_entries[0])
              if ba2 and bo: entries.append(all_entries[1])
              if ba3 and build_ubuntu: entries.append(all_entries[2])
              if ba3 and bo: entries.append(all_entries[3])
              if b310p and build_ubuntu: entries.append(all_entries[4])
              if b310p and bo: entries.append(all_entries[5])
          print(f"matrix={json.dumps({'build_meta': entries})}")
          PYEOF

  image_build:
    name: Image Build and Push
    needs: generate-matrix
    if: ${{ !((github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'image-build')))
        && !(github.event_name == 'workflow_dispatch' && inputs.vllm_commit != '' && inputs.vllm_ascend_commit != '') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    uses: ./.github/workflows/_schedule_image_build.yaml
    with:
      dockerfile: ${{ matrix.build_meta.dockerfile }}
      suffix: ${{ matrix.build_meta.suffix }}
      image: ${{ matrix.build_meta.image }}
      should_push: ${{ github.event_name != 'pull_request' }}
      quay_username: ${{ vars.QUAY_USER_NAME }}
      workflow_dispatch_tag: ${{ inputs.tag != 'none' && inputs.tag || '' }}
      branch_ref: ${{ inputs.branch != 'none' && inputs.branch || '' }}
    secrets:
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}

  image_build_by_commit:
    name: Image Build (commit mode) and Push
    needs: generate-matrix
    if: ${{ github.event_name == 'workflow_dispatch'
        && inputs.vllm_commit != ''
        && inputs.vllm_ascend_commit != ''
        && inputs.tag == 'none'
        && inputs.branch == 'none' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    uses: ./.github/workflows/_schedule_image_build.yaml
    with:
      dockerfile: ${{ matrix.build_meta.dockerfile }}
      suffix: ${{ matrix.build_meta.suffix }}
      # Commit mode always pushes (to QUAY_TEMP_REPO only) and never promotes
      # the image to QUAY_REPO via merge-image.
      should_push: true
      temp_only: true
      image: ${{ matrix.build_meta.image }}
      quay_username: ${{ vars.QUAY_USER_NAME }}
      vllm_commit: ${{ inputs.vllm_commit }}
      vllm_ascend_commit: ${{ inputs.vllm_ascend_commit }}
      workflow_dispatch_tag: ''
      branch_ref: ''
    secrets:
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
